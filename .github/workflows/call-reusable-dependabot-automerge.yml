# Public export from seankoji-com/.github; generated by scripts/render_caller.py.
# Dependabot Auto-Merge — synced from seankoji-com/.github (panel/call-reusable-dependabot-automerge.yml)
# Enables auto-merge for dependabot PRs after CI + reviews pass.
# Major version bumps are excluded (require human approval).
# Uses the org-wide SEANKOJI_CI_APP_ID / SEANKOJI_CI_PRIVATE_KEY App identity
# (Contents:Write and PullRequests:Write) — no per-repo secrets required.
name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A rebase or retry push to an open Dependabot PR fires another `synchronize`
# run before the prior one finishes. Without this, both runs evaluate
# auto-merge eligibility independently and the stale one can still act on an
# outdated diff after the newer push landed.
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run for dependabot PRs
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Enabling auto-merge for dependabot PR: $PR_URL"

          # Check if PR is a minor/patch bump (not a major version bump)
          title="$PR_TITLE"

          # Skip major bumps — those need explicit human approval
          if echo "$title" | grep -qiE 'bump .+ from [0-9]+\.[0-9]+\.[0-9]+ to [0-9]+\.'; then
            echo "Skipping: appears to be a major version bump."
            exit 0
          fi

          gh pr merge --auto --squash "$PR_URL"
          echo "Auto-merge enabled — will merge when all required checks pass."
