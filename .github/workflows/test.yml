name: Test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      # Coverage reporting starts advisory so converter outages cannot freeze merges.
      # Preserve the existing test gate and any established coverage threshold.
      - name: Generate Cobertura coverage (advisory)
        if: runner.os == 'Linux'
        id: cobertura
        continue-on-error: true
        shell: bash
        run: go run github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484 -strict < coverage.out > coverage.xml
      - name: Retain coverage reports (advisory)
        if: steps.cobertura.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.xml
          if-no-files-found: error
          retention-days: 14

      - run: go vet ./...
      - run: go build -o bin/ralph .
      - run: python3 scripts/smoke.py
