name: Test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      # Coverage reporting starts advisory so converter outages cannot freeze merges.
      # Preserve the existing test gate and any established coverage threshold.
      - name: Generate Cobertura coverage (advisory)
        if: runner.os == 'Linux'
        id: cobertura
        continue-on-error: true
        shell: bash
        run: go run github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484 -strict < coverage.out > coverage.xml
      - name: Retain coverage reports (advisory)
        if: steps.cobertura.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: README Go version matches go.mod
        if: runner.os == 'Linux'
        shell: bash
        run: |
          want=$(awk '$1 == "go" {print $2; exit}' go.mod)
          grep -qF "Requires Go ${want} or newer" README.md || { echo "README.md must say 'Requires Go ${want} or newer' (go.mod: ${want})"; exit 1; }
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go build -o bin/ralph .
      - run: python3 scripts/smoke.py
